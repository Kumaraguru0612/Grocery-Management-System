{% extends "base.html" %}{% block content %}<h2>Categories</h2><form method="post" class="input-group mb-3"><input class="form-control" name="name" placeholder="New category name" required><button class="btn btn-success">Add category</button></form><div class="card"><div class="table-responsive"><table class="table mb-0"><tr><th>Category</th><th>Update</th><th>Delete</th></tr>{% for c in categories %}<tr><td>{{c.category_name}}</td><td><form class="d-flex gap-2" method="post" action="/categories/{{c.category_id}}/edit"><input class="form-control form-control-sm" name="name" value="{{c.category_name}}" required><button class="btn btn-sm btn-outline-primary">Save</button></form></td><td><form method="post" action="/categories/{{c.category_id}}/delete" onsubmit="return confirm('Delete category?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="3">No categories.</td></tr>{% endfor %}</table></div></div>{% endblock %}
