{% extends "base.html" %}{% block content %}<h2>Stock purchases</h2><div class="card mb-4"><div class="card-body"><form method="post" class="row g-2"><div class="col-md-5"><select class="form-select" name="product_id" required><option value="">Select product</option>{% for p in products %}<option value="{{p.product_id}}">{{p.product_name}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="number" min="1" name="quantity" placeholder="Quantity" required></div><div class="col-md-2"><input class="form-control" type="number" min="0" step=".01" name="unit_cost" placeholder="Unit cost ₹" required></div><div class="col-md-2"><button class="btn btn-success w-100">Record purchase</button></div></form></div></div><div class="card table-responsive"><table class="table mb-0"><tr><th>ID</th><th>Product</th><th>Qty</th><th>Unit cost</th><th>Total</th><th>Date</th></tr>{% for p in purchases %}<tr><td>{{p.purchase_id}}</td><td>{{p.product_name}}</td><td>{{p.quantity}}</td><td>₹{{p.unit_cost}}</td><td>₹{{p.total_cost}}</td><td>{{p.purchase_date}}</td></tr>{% else %}<tr><td colspan="6">No purchases recorded.</td></tr>{% endfor %}</table></div>{% endblock %}
