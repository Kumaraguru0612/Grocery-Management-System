{% extends "base.html" %}{% block content %}<h2>Edit product</h2><div class="card"><div class="card-body"><form method="post" class="row g-3"><div class="col-md-4"><label class="form-label">Product name</label><input class="form-control" name="name" value="{{product.product_name}}" required></div><div class="col-md-3"><label class="form-label">Category</label><select class="form-select" name="category_id">{% for c in categories %}<option value="{{c.category_id}}" {% if c.category_id==product.category_id %}selected{% endif %}>{{c.category_name}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Supplier</label><select class="form-select" name="supplier_id"><option value="0">No supplier</option>{% for s in suppliers %}<option value="{{s.supplier_id}}" {% if s.supplier_id==product.supplier_id %}selected{% endif %}>{{s.supplier_name}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Selling price</label><input class="form-control" type="number" min="0" step=".01" name="price" value="{{product.unit_price}}" required></div><div class="col-md-3"><label class="form-label">Reorder level</label><input class="form-control" type="number" min="0" name="reorder_level" value="{{product.reorder_level}}" required></div><div class="col-12"><button class="btn btn-success">Save changes</button> <a class="btn btn-light" href="/products">Cancel</a></div></form></div></div>{% endblock %}
