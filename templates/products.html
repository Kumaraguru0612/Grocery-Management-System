{% extends "base.html" %}{% block content %}<h2>Products</h2><div class="card mb-4"><div class="card-header">Add product</div><div class="card-body"><form method="post" class="row g-2">
<div class="col-md-3"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-2"><select class="form-select" name="category_id" required><option value="">Category</option>{% for c in categories %}<option value="{{c.category_id}}">{{c.category_name}}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="supplier_id"><option value="0">No supplier</option>{% for s in suppliers %}<option value="{{s.supplier_id}}">{{s.supplier_name}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" type="number" min="0" step=".01" name="price" placeholder="Price ₹" required></div><div class="col-md-1"><input class="form-control" type="number" min="0" name="quantity" placeholder="Qty" required></div><div class="col-md-1"><input class="form-control" type="number" min="0" name="reorder_level" value="10" title="Reorder level"></div><div class="col-md-1"><button class="btn btn-success w-100">Add</button></div></form></div></div>
<div class="table-responsive card"><table class="table table-hover mb-0"><thead><tr><th>Name</th><th>Category</th><th>Supplier</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>{% for p in products %}<tr><td>{{p.product_name}}</td><td>{{p.category_name}}</td><td>{{p.supplier_name or '—'}}</td><td>₹{{p.unit_price}}</td><td>{{p.quantity}}</td><td><a class="btn btn-sm btn-outline-primary me-1" href="/products/{{p.product_id}}/edit">Edit</a><form class="d-inline" method="post" action="/products/{{p.product_id}}/delete" onsubmit="return confirm('Archive this product?')"><button class="btn btn-sm btn-outline-danger">Archive</button></form></td></tr>{% else %}<tr><td colspan="6">No products yet. Add one above.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
