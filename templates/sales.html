{% extends "base.html" %}{% block content %}<h2>Sales</h2><div class="card mb-4"><div class="card-body"><form method="post" class="row g-2"><div class="col-md-5"><select class="form-select" name="product_id" required><option value="">Select product</option>{% for p in products %}<option value="{{p.product_id}}">{{p.product_name}} — ₹{{p.unit_price}} ({{p.quantity}} available)</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="number" min="1" name="quantity" placeholder="Quantity" required></div><div class="col-md-2"><select class="form-select" name="payment_method"><option>Cash</option><option>UPI</option><option>Card</option></select></div><div class="col-md-2"><button class="btn btn-success w-100">Complete sale</button></div></form></div></div><div class="card table-responsive"><table class="table mb-0"><tr><th>Bill</th><th>Date</th><th>Lines</th><th>Payment</th><th>Total</th></tr>{% for s in sales %}<tr><td>#{{s.sale_id}}</td><td>{{s.sale_date}}</td><td>{{s.item_lines}}</td><td>{{s.payment_method}}</td><td>₹{{s.total_amount}}</td></tr>{% else %}<tr><td colspan="5">No sales recorded.</td></tr>{% endfor %}</table></div>{% endblock %}
