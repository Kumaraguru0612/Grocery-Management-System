{% extends "base.html" %}{% block content %}<h2>Suppliers</h2><form method="post" class="row g-2 mb-4"><div class="col-md-4"><input class="form-control" name="name" placeholder="Supplier name" required></div><div class="col-md-3"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email"></div><div class="col-md-2"><button class="btn btn-success w-100">Add supplier</button></div></form><div class="card table-responsive"><table class="table mb-0"><tr><th>Supplier</th><th>Phone</th><th>Email</th><th>Update</th><th>Delete</th></tr>{% for s in suppliers %}<tr><td>{{s.supplier_name}}</td><td>{{s.phone or '—'}}</td><td>{{s.email or '—'}}</td><td><form method="post" action="/suppliers/{{s.supplier_id}}/edit" class="d-flex gap-1"><input class="form-control form-control-sm" name="name" value="{{s.supplier_name}}" required><input class="form-control form-control-sm" name="phone" value="{{s.phone or ''}}" placeholder="Phone"><input class="form-control form-control-sm" name="email" value="{{s.email or ''}}" placeholder="Email"><button class="btn btn-sm btn-outline-primary">Save</button></form></td><td><form method="post" action="/suppliers/{{s.supplier_id}}/delete"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No suppliers.</td></tr>{% endfor %}</table></div>{% endblock %}
